appId: com.sophon.desktop
asar: true
npmRebuild: false
compression: maximum
electronLanguages:
  - en-US
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
productName: Sophon
publish:
  provider: github
  owner: Chirraaa
  repo: sophon
  private: false
  releaseType: release
directories:
  buildResources: build
files:
  - out/**
  - package.json
  - resources/icon.png
  - '!**/*.map'
  # pdfjs uses the browser canvas in Sophon's isolated renderer. Its optional
  # Node canvas peer is never loaded by the app and contributes a 28 MB binary.
  - '!node_modules/@napi-rs/canvas'
  - '!node_modules/@napi-rs/canvas/**'
  - '!node_modules/@napi-rs/canvas-*'
  - '!node_modules/@napi-rs/canvas-*/**'
asarUnpack:
  - resources/**
  - node_modules/koffi/**
extraFiles:
  - from: LICENSE
    to: LICENSE.sophon.txt
  - from: NOTICE.md
    to: NOTICE.sophon.md
  - from: THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: legal/SOURCE_AVAILABILITY.md
    to: SOURCE_AVAILABILITY.md
extraResources:
  - from: resources/whisper
    to: whisper
win:
  target: nsis
  icon: build/icon.ico
  executableName: Sophon
  # Manifest hashes authenticate these exact reviewed bytes. Signing them during
  # copying would invalidate the hashes; the signed app authenticates the manifest.
  signExts:
    - '!whisper-server.exe'
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
linux:
  icon: build/icon.png
